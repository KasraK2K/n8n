name: n8n-professional

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-n8n-env: &n8n-env
  TZ: ${TZ}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}
  N8N_PROTOCOL: ${N8N_PROTOCOL}
  N8N_LOG_LEVEL: ${N8N_LOG_LEVEL}
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_DEFAULT_BINARY_DATA_MODE: database
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
  DB_POSTGRESDB_USER: ${POSTGRES_NON_ROOT_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}
  EXECUTIONS_MODE: queue
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: "6379"
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE}
  EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT}
  N8N_RUNNERS_ENABLED: "true"
  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
  NODES_EXCLUDE: ${NODES_EXCLUDE:-["n8n-nodes-base.executeCommand"]}

x-runner-env: &runner-env
  N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
  N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: ${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT}
  NODE_FUNCTION_ALLOW_BUILTIN: ${NODE_FUNCTION_ALLOW_BUILTIN}
  NODE_FUNCTION_ALLOW_EXTERNAL: ${NODE_FUNCTION_ALLOW_EXTERNAL}
  N8N_RUNNERS_STDLIB_ALLOW: ${N8N_RUNNERS_STDLIB_ALLOW}
  N8N_RUNNERS_EXTERNAL_ALLOW: ${N8N_RUNNERS_EXTERNAL_ALLOW}
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE}

x-n8n-common: &n8n-common
  image: n8n-professional/custom-n8n:${N8N_VERSION}
  build:
    context: .
    dockerfile: docker/n8n/Dockerfile
    args:
      N8N_VERSION: ${N8N_VERSION}
  restart: unless-stopped
  logging: *default-logging
  networks:
    - internal
  environment: *n8n-env
  volumes:
    - n8n_storage:/home/node/.n8n
    - ./workspace:/files
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-runner-common: &runner-common
  image: n8n-professional/custom-n8n-runner:${N8N_VERSION}
  build:
    context: .
    dockerfile: docker/runners/Dockerfile
    args:
      N8N_VERSION: ${N8N_VERSION}
      JS_EXTRA_PACKAGES: ${JS_EXTRA_PACKAGES}
  restart: unless-stopped
  logging: *default-logging
  networks:
    - internal
  environment: *runner-env
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "require('http').get('http://127.0.0.1:5680/healthz', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
      ]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_NON_ROOT_USER: ${POSTGRES_NON_ROOT_USER}
      POSTGRES_NON_ROOT_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
      - ./docker/postgres/init/01-create-n8n-user.sh:/docker-entrypoint-initdb.d/01-create-n8n-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_storage:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    <<: *n8n-common
    environment:
      <<: *n8n-env
      N8N_HOST: ${N8N_HOST}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5678/healthz/readiness', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  n8n-worker:
    <<: *n8n-common
    command: ["worker", "--concurrency=${WORKER_CONCURRENCY}"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:5678/healthz', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  n8n-worker-runner:
    <<: *runner-common
    depends_on:
      n8n-worker:
        condition: service_healthy

volumes:
  postgres_storage:
  redis_storage:
  n8n_storage:

networks:
  internal:
    driver: bridge


